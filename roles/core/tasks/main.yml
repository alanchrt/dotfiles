---
- name: Add RPM Fusion GPG keys
  become: yes
  rpm_key:
    key: "{{ item }}"
  with_items:
    - https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-free-fedora-2020
    - https://rpmfusion.org/keys?action=AttachFile&do=get&target=RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020

- name: Enable the RPM Fusion repositories
  become: yes
  dnf:
    name:
      - "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
      - "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"

- name: Install core packages
  become: yes
  dnf:
    name:
      - dnf-plugins-core
      - ansible
      - flameshot
      - ImageMagick
      - pandoc
      - paperkey
      - yubikey-manager
      - cargo
      - gcc-c++
      - cmake
      - rubygem-gist
      - dconf-editor
      - gnome-extensions-app
      - gnome-tweaks
      - make
      - gcc
      - zlib-devel
      - bzip2
      - bzip2-devel
      - readline-devel
      - sqlite
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - libffi-devel
      - xz-devel
      - libpq-devel
      - postgresql
      - oniguruma-devel
      - libacl-devel
      - libcap-devel
      - libjpeg-turbo-devel
      - libjpeg-turbo-utils
      - python3-devel
      - libxslt-devel
      - dbus-devel
      - libxcrypt-compat
      - patch
      - systemd-oomd-defaults
      - zram-generator-defaults
    update_cache: yes

- name: Configure a 16 GiB compressed-memory swap device
  become: yes
  ansible.builtin.copy:
    src: zram-generator.conf
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: "0644"
  register: zram_generator_config

- name: Explain when the zram change takes effect
  ansible.builtin.debug:
    msg: "zram is configured for up to 16 GiB; reboot after this playbook run to activate the new size."
  when: zram_generator_config.changed

- name: Enable and start userspace out-of-memory protection
  become: yes
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - systemd-oomd.socket
    - systemd-oomd.service

- name: Install ffmpeg from RPM Fusion
  become: yes
  dnf:
    allowerasing: true
    name: ffmpeg

- name: Configure flathub
  become: yes
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
